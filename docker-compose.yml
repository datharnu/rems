services:
  backend:
    build: ./backend
    container_name: rems-backend
    env_file:
      - ./backend/.env
    environment:
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - PORT=3001
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - rems

  frontend:
    build: ./frontend
    container_name: rems-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - rems

networks:
  rems:
    driver: bridge
